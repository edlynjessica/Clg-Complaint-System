<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Maintenance System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <h1>College Maintenance System</h1>
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = document.getElementById("message");

            try {
                const data = await apiRequest("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    })
                });

                saveAuth(data);

                const user = getCurrentUser();

                if (user.role === "Faculty / Staff") {
                    window.location.href = "faculty.html";
                } else if (user.role === "Service Incharge") {
                    window.location.href = "incharge.html";
                } else if (user.role === "Technician") {
                    window.location.href = "technician.html";
                } else if (user.role === "Admin") {
                    window.location.href = "admin.html";
                } else {
                    message.textContent = "Invalid user role";
                }

            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>

</body>
</html>
