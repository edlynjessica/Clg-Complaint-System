<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <h1>Admin Dashboard</h1>

        <button onclick="logout()">Logout</button>

        <hr>

        <h2>Complaint Statistics</h2>

        <div id="stats">
        <div class="stat-card">
            <h3>Total Complaints</h3>
            <p id="total">-</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pending">-</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="inProgress">-</p>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <p id="resolved">-</p>
        </div>

        <div class="stat-card">
            <h3>Closed</h3>
            <p id="closed">-</p>
        </div>

        <div class="stat-card">
            <h3>Electrical</h3>
            <p id="electrical">-</p>
        </div>

        <div class="stat-card">
            <h3>Plumbing</h3>
            <p id="plumbing">-</p>
        </div>

        <div class="stat-card">
            <h3>Escalated</h3>
            <p id="escalated">-</p>
        </div>

        <div class="stat-card">
            <h3>Overdue</h3>
            <p id="overdue">-</p>
        </div>
    </div>

        <hr>

        <h2>All Complaints</h2>

        <button id="loadComplaints">Load All Complaints</button>

        <div id="complaints"></div>
        <hr>

        <h2>User Management</h2>

        <button id="loadUsers">Load Users</button>

        <div id="users"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
